# .roadmap/features.yaml — 功能台账
# 本文件是该项目功能状态的唯一事实源;yPulse 采集(schema v1,见 yPulse 仓库 docs/feature-ledger.md)。
# 约定:完成一个功能 = 同一次提交里更新对应条目(置 done + completedAt)。
# 阶段与每阶段的完成标准在 docs/plan.md。

project: maosensen/zeroUI
track: oss
launchedAt: 2026-10-24
areas: [地基, 组件, 注册表, 站点与文档, 工作台, 工程与基建]

modules:
  - id: license
    title: 开源许可证
    tier: required
    status: done
    completedAt: 2026-10-25
    note: MIT(作者 2026-10-25 定),GitHub 的标准 MIT 正文;版权人 maosensen。
  - id: install-works
    title: 在一个全新的 shadcn 项目里装得上、跑得起来
    tier: required
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: shadcn init -d -b base 新建的 Next 项目,@zeroui 指向本机 registry,五个组件 + theme + icons 一条命令装上;import 全部落对、带类型检查的生产构建通过、页面与工作台一致。部署后要对线上地址再装一次。

features:
  # ── 工程与基建 ────────────────────────────────────────────────────────
  - id: scaffold
    title: 干净的 shadcn 工程(Base UI、只有暗色)
    area: 工程与基建
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: |
      Next 16、React 19、Tailwind v4、Biome、React Compiler、pnpm;shadcn base-maia 风格,底层 Base UI,
      全部组件拉进来作起点;主题强制 dark;端口 4374。不从 yTemplate 起,理由见 docs/plan.md。
  # ── 地基(第一阶段)──────────────────────────────────────────────────
  - id: tokens
    title: 设计 token(颜色、字号、描边、斜切角、间距、层级)
    area: 地基
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: 颜色、字号、控件高度、描边、斜切角、层级、轨道内距(src/styles/zero/tokens.css)。第三、四个组件(Input、Select)一处未改,第一阶段的退出检验通过。v0.1.0 之后加了正文字 --font-zero-text(Outfit),标签仍用 Montserrat(docs/plan.md 2026-10-24「two faces」)。
  - id: motion
    title: 动效函数(时长、缓动、按下、滑块、展开、切入、故障)
    area: 地基
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: 时长、缓动、按下 / 回弹、滑块、展开、收起、扫光(motion.css + motion.ts),四个组件全部只用这些。切入与故障四个组件都没用到,留给第一个需要它们的组件族再定(docs/plan.md 2026-10-24)。
  - id: icon-spec
    title: 图标规范与第一批图标
    area: 地基
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: 规范在 docs/icons.md:24 格网格、实心填充、横向笔画以 1:4 斜切收尾、斜线 45°、切角不倒圆、只有天生是圆的才用曲线;可选墨色描边。十九个图标(方向 6、状态 5、操作 7、加载 1),每个一个文件,替换掉组件里的一次性箭头;工作台顶部有图标表。界面图标在代码里手画,yIcon 管 logo 与插画。
  # ── 组件(第一阶段)──────────────────────────────────────────────────
  - id: button
    title: Button
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: 四种(primary / secondary / danger / ghost)× 三档 × 四种切边;按下回弹、扫光、选中框(黄框 + 墨色间隙)。
  - id: input
    title: Input
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: 内凹的井(void 填充、安静的描边),整个 slab 都能点进输入;焦点是黄框,出错描边转红,出错且聚焦时是亮红框;光标是强调色。顺带 Field 的标签、说明、错误三件(错误前一枚斜块,滑入、退得更快)。没有改动任何 token、动效与 slab —— 退出检验过了一半。之后加了前后槽位(start / end:图标或 InputAction,清空、显示密码)。
  - id: field
    title: Field(标签、说明、错误)
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: 包着 Base UI 的 Field;错误前一枚斜块,滑入、退得更快。随 Input 一起做,发版时按可单独宣布的能力拆出。
  - id: select
    title: Select
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: 触发器是和 Input 同样的内凹井,箭头打开时翻转;弹出层是靠描边抬起的直角方框(粗墨色边 + 外圈细线),从触发器往下展开、收起更快;高亮行是尾端斜切的强调色 slab,已选项前一枚斜块。分组、分隔线、禁用项、长列表滚动。没有改动地基 —— 退出检验通过。
  - id: tabs
    title: Tabs(斜切滑块)
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: 两侧斜切的轨道 + 两侧斜切的强调色滑块,弹簧滑到当前页签,两端都与轨道切边平行、相距 --zero-inset;每个页签带一份裁到滑块位置的墨色标签,滑动中标签压在滑块上的部分变黑。三档尺寸。
  # ── 表单家族(第三阶段)──────────────────────────────────────────────
  - id: checkbox
    title: Checkbox
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 两侧斜切的小 slab,未选是内凹的井,选中填强调色、黑勾弹入;半选显示减号。尺寸用 em,跟着标签文字走。
  - id: radio-group
    title: Radio group
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 和 Checkbox 同样的小井,选中的那个里嵌一块强调色 slab(Tabs 的几何),弹入;勾选填满、单选嵌块,两者不会看混。
  - id: switch
    title: Switch
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 斜切轨道 + 一块滑块;打开时轨道填强调色,滑块变墨色、带过冲弹到另一端,两端都与轨道切边平行、相距 --zero-inset。
  - id: textarea
    title: Textarea
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 与 Input 同一口井;高度随内容长,所以按「高度不定 = 直角矩形」的规则做成矩形;在 Field 里就是 Field 的控件。
  - id: slider
    title: Slider
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 细的斜切轨道,已选段强调色,每个拇指一块 slab,拖动时转强调色;一个值或两个值的区间。
  # ── 注册表、站点与工作台(第二阶段)──────────────────────────────────
  # ── 浮层家族(第三阶段)──────────────────────────────────────────────
  - id: dialog
    title: Dialog
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 暗下来的页面上一块 panel;黑色标题栏、倾斜标题、角上的关闭键;从中心展开、收起更快(pop),背景淡入(fade)。
  - id: sheet
    title: Sheet
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 从屏幕一边滑入并贴着那一边的对话框,朝页面的一侧是墨色粗边;上下左右四边;减弱动态效果时只淡入。
  - id: popover
    title: Popover
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 触发器旁边的一块 panel,放几行字或一个小表单;从触发器展开。
  - id: tooltip
    title: Tooltip
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 只一行,所以高度已知、做成两侧斜切的浅色 slab;悬停与键盘聚焦都会打开,TooltipProvider 里相邻的立即打开。
  - id: dropdown-menu
    title: Dropdown menu
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 行用 Select 的行(尾端斜切、高亮填强调色);图标、快捷键、勾选行、单选行(斜块)、危险行;暂无子菜单。
  - id: alert
    title: Alert
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 直角方框、起始边与徽章用类型色;信息/成功/警告/危险四种,颜色全用已有 token;新增 done 徽章图标。
  - id: progress
    title: Progress
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 斜切细轨道 + 强调色填充;segments 分段(一格格亮起);无值时小块来回扫,减弱动态时改为静止的暗色满条。
  - id: skeleton
    title: Skeleton
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 方块、斜切文字行、控件大小的 slab 三种形状;沿斜角循环划过的光(glint),减弱动态时停住;SkeletonText 多行。
  - id: toast
    title: Toast
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: Alert 的样子加浮起轮廓;从右滑入右下角,最新的贴角;右滑或关闭按钮提前关掉,其余收拢;最多同时三条,可带一个动作按钮。
  - id: card
    title: Card
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 直角方框(墨色边框 + 表面 + 斜纹);标题在黑色条上,尾端放 CardAction;页脚细线分隔;interactive 悬停时轮廓变强调色。
  - id: table
    title: Table
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 表头黑条 + 小号斜体大写;单元格用正文字体;悬停行变亮,选中行保持并在起始边加强调色;过宽时横向滚动。
  - id: badge
    title: Badge
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 两侧斜切的小 slab,四种(强调色、灰、黑色凹槽描边、危险红);可带图标,render 可变成链接。
  - id: avatar
    title: Avatar
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 圆形(按 tokens 的约定,天生圆的东西才用圆角),墨色圈加细线轮廓;三种尺寸对齐控件高度;首字母兜底、状态圆点、重叠的头像组与计数。
  - id: breadcrumb
    title: Breadcrumb
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 斜体路径,用斜切短条分隔;上级页面安静、悬停变亮,当前页最亮最粗;省略号用新的 more 图标;render 接路由链接。
  - id: pagination
    title: Pagination
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 每页是两侧斜切的小 Button slab,像 tabs 一样嵌套;当前页填强调色;上一页/下一页带箭头,手机上只留箭头。
  - id: sidebar
    title: Sidebar
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 黑色斜纹侧栏,行用 Dropdown menu 的行,当前页填强调色;可整个收起或折成图标栏(折叠时 tooltip 显示名称),手机上是 Sheet;⌘B / Ctrl+B 切换;子菜单、计数。暂无 floating/inset 变体、拖拽条、记住状态的 cookie。
  - id: accordion
    title: Accordion
    area: 组件
    status: done
    completedAt: 2026-10-25
    note: 细线分隔的分节,一次开一节(multiple 可多开);斜体标题前一道斜条,展开时亮强调色,尾端箭头翻转;按自身高度展开,减弱动态时直接出现。
  - id: collapsible
    title: Collapsible
    area: 组件
    status: done
    completedAt: 2026-10-25
    note: 原地展开的面板,按揭示时长展开、更快收起;触发器不带样式,用 render 接 Button。
  - id: toggle
    title: Toggle
    area: 组件
    status: done
    completedAt: 2026-10-25
    note: 会保持按下的 Button:关时 ghost 或灰色 slab,开时填强调色(aria-pressed);尺寸与切角同 Button。
  - id: toggle-group
    title: Toggle group
    area: 组件
    status: done
    completedAt: 2026-10-25
    note: 两侧斜切的 Toggle 排成一行、像 tabs 一样嵌套;单选或 multiple 多选;方向键移动;样式在组上统一设定。
  - id: separator
    title: Separator
    area: 组件
    status: done
    completedAt: 2026-10-25
