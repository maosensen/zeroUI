  - id: sheet
    title: Sheet
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 从屏幕一边滑入并贴着那一边的对话框,朝页面的一侧是墨色粗边;上下左右四边;减弱动态效果时只淡入。
  - id: popover
    title: Popover
    area: 组件
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.1
    note: 触发器旁边的一块 panel,放几行字或一个小表单;从触发器展开。
  - id: tooltip
