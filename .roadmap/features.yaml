  - id: registry
    title: shadcn registry(shadcn add 一行装上)
    area: 注册表
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: '@zeroui 命名空间:registry add 一次,之后 shadcn add @zeroui/button。29 项:font、foundation、theme、icon、19 个图标 + icons、五个组件。scripts/build-registry.mts 把 src/styles/zero 的 CSS 转成条目的 css 与 cssVars,再 shadcn build 出 public/r。'
  - id: theme
    title: 一条命令变暗(@zeroui/theme)
    area: 注册表
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: registry:theme 条目,把宿主项目的 shadcn 变量(含 sidebar、chart)指向 zeroUI 的颜色,亮暗两套一样。
  - id: docs
    title: 文档页(每个组件的演示、属性、安装命令)
    area: 站点与文档
    status: done
    completedAt: 2026-10-24
    shippedIn: v0.1.0
    note: /docs:上手页、五个组件各一页、图标页。每页有分包管理器的安装命令、活的演示(展示的代码就是演示文件本身)、行为说明、每个部件一张属性表并链到底层的 Base UI 部件;代码在服务端用 zeroUI 自己的配色高亮。手机宽度下导航变成横向一行,宽的演示在自己的框里横向滚动。
  - id: seo
